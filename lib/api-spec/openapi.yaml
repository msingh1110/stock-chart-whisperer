openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trading signals API powered by Alpaca Markets
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: signals
    description: Trading signal operations
paths:
  /probability-evaluation:
    get:
      operationId: getProbabilityEvaluation
      tags: [signals]
      summary: Weekly five-session probability evaluation and automatic model history
      responses:
        "200":
          description: Persistent evaluation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbabilityEvaluation"
        "503":
          description: Evaluation storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /signals:
    get:
      operationId: getAllSignals
      tags: [signals]
      summary: Get trading signals for all portfolio stocks
      description: Returns signals for NVDA, MSFT, AAPL, META, SOFI, HOOD
      responses:
        "200":
          description: List of stock signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockSignal"
        "500":
          description: Error fetching signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /signals/{ticker}:
    get:
      operationId: getSignalByTicker
      tags: [signals]
      summary: Get signal and price history for a specific stock
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock signal with full price history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockSignalDetail"
        "404":
          description: Ticker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Error fetching signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      tags: [signals]
      summary: Get a portfolio-level summary of all signals
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"
        "500":
          description: Error fetching summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    ProbabilityParameters:
      type: object
      required: [method, slope, intercept, weights]
      properties:
        method:
          type: string
          enum: [linear, logistic]
        slope:
          type: number
        intercept:
          type: number
        weights:
          type: object
          required: [trend, momentum, rsi, volume, news, social, fundamentals]
          properties:
            trend: { type: number }
            momentum: { type: number }
            rsi: { type: number }
            volume: { type: number }
            news: { type: number }
            social: { type: number }
            fundamentals: { type: number }
    ProbabilityModelVersion:
      type: object
      required: [id, createdAt, active, reason, parameters]
      properties:
        id: { type: integer }
        createdAt: { type: string }
        active: { type: boolean }
        reason: { type: string }
        parameters:
          $ref: "#/components/schemas/ProbabilityParameters"
    ProbabilityMetrics:
      type: object
      required: [count, brier, logLoss, accuracy, calibration]
      properties:
        count: { type: integer }
        brier: { type: number }
        logLoss: { type: number }
        accuracy: { type: number }
        calibration:
          type: array
          items:
            type: object
            required: [lower, upper, count, predicted, observed]
            properties:
              lower: { type: number }
              upper: { type: number }
              count: { type: integer }
              predicted: { type: number }
              observed: { type: number }
    ProbabilityReport:
      type: object
      required: [id, week, createdAt, decision, reason, completedCount, independentPeriods, currentModelId, resultingModelId, trainCount, validationCount, testCount, currentMetrics, candidateMetrics, baselineBrier, improvementLowerBound, candidateParameters]
      properties:
        id: { type: integer }
        week: { type: string }
        createdAt: { type: string }
        decision:
          type: string
          enum: [insufficient_data, kept, promoted]
        reason: { type: string }
        completedCount: { type: integer }
        independentPeriods: { type: integer }
        currentModelId: { type: integer }
        resultingModelId: { type: integer }
        trainCount: { type: integer }
        validationCount: { type: integer }
        testCount: { type: integer }
        currentMetrics:
          anyOf:
            - $ref: "#/components/schemas/ProbabilityMetrics"
            - type: "null"
        candidateMetrics:
          anyOf:
            - $ref: "#/components/schemas/ProbabilityMetrics"
            - type: "null"
        baselineBrier: { type: [number, "null"] }
        improvementLowerBound: { type: [number, "null"] }
        candidateParameters:
          anyOf:
            - $ref: "#/components/schemas/ProbabilityParameters"
            - type: "null"
    ProbabilityPrediction:
      type: object
      required: [id, ticker, asOfDate, capturedAt, modelId, probability, referenceClose, outcomeDate, outcomeClose, outcome, returnPercent]
      properties:
        id: { type: integer }
        ticker: { type: string }
        asOfDate: { type: string }
        capturedAt: { type: string }
        modelId: { type: integer }
        probability: { type: number }
        referenceClose: { type: number }
        outcomeDate: { type: [string, "null"] }
        outcomeClose: { type: [number, "null"] }
        outcome: { type: [integer, "null"] }
        returnPercent: { type: [number, "null"] }
    ProbabilityEvaluation:
      type: object
      required: [horizonSessions, automatic, schedule, status, totalPredictions, pendingPredictions, completedPredictions, minimumIndependentPeriods, independentPeriods, lastCapturedAt, lastEvaluatedAt, nextCaptureAt, nextEvaluationAt, lastError, activeModel, modelHistory, reports, recentPredictions, observedMetrics, methodology]
      properties:
        horizonSessions: { type: integer }
        automatic: { type: boolean }
        schedule: { type: string }
        status:
          type: string
          enum: [collecting, monitoring, degraded]
        totalPredictions: { type: integer }
        pendingPredictions: { type: integer }
        completedPredictions: { type: integer }
        minimumIndependentPeriods: { type: integer }
        independentPeriods: { type: integer }
        lastCapturedAt: { type: [string, "null"] }
        lastEvaluatedAt: { type: [string, "null"] }
        nextCaptureAt: { type: string }
        nextEvaluationAt: { type: string }
        lastError: { type: [string, "null"] }
        activeModel:
          $ref: "#/components/schemas/ProbabilityModelVersion"
        modelHistory:
          type: array
          items:
            $ref: "#/components/schemas/ProbabilityModelVersion"
        reports:
          type: array
          items:
            $ref: "#/components/schemas/ProbabilityReport"
        recentPredictions:
          type: array
          items:
            $ref: "#/components/schemas/ProbabilityPrediction"
        observedMetrics:
          anyOf:
            - $ref: "#/components/schemas/ProbabilityMetrics"
            - type: "null"
        methodology:
          type: array
          items: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SignalType:
      type: string
      enum: [BUY, SELL, HOLD]

    ConfidenceTier:
      type: string
      enum: [STRONG BUY, BUY, HOLD, SELL, STRONG SELL]

    FundamentalsSnapshot:
      type: object
      nullable: true
      properties:
        marketCap:         { type: number, nullable: true }
        peRatio:           { type: number, nullable: true }
        eps:               { type: number, nullable: true }
        week52High:        { type: number, nullable: true }
        week52Low:         { type: number, nullable: true }
        beta:              { type: number, nullable: true }
        sharesOutstanding: { type: number, nullable: true }
      required: [marketCap, peRatio, eps, week52High, week52Low, beta, sharesOutstanding]

    NewsArticle:
      type: object
      properties:
        headline:    { type: string }
        source:      { type: string }
        publishedAt: { type: string }
        url:         { type: string }
      required: [headline, source, publishedAt, url]

    FinnhubContext:
      type: object
      properties:
        dailyChangePct:
          type: number
          nullable: true
        peRatio:
          type: number
          nullable: true
        eps:
          type: number
          nullable: true
        newsHeadlineCount:
          type: number
        newsSentimentSummary:
          type: string
          enum: [positive, neutral, negative]
        socialSentimentSummary:
          type: string
          enum: [bullish, neutral, bearish]
      required:
        - dailyChangePct
        - peRatio
        - eps
        - newsHeadlineCount
        - newsSentimentSummary
        - socialSentimentSummary

    StockSignal:
      type: object
      properties:
        ticker:
          type: string
        currentPrice:
          type: number
        prevClose:
          type: number
          description: Previous session closing price
        ma20:
          type: number
        ma50:
          type: number
        rsi:
          type: number
        price5dAgo:
          type: number
          description: Closing price 5 trading days ago
        signal:
          $ref: "#/components/schemas/SignalType"
        confidenceTier:
          $ref: "#/components/schemas/ConfidenceTier"
        change:
          type: number
          description: Price change from previous close
        changePercent:
          type: number
          description: Percentage price change from previous close
        lastUpdated:
          type: string
          description: ISO timestamp of when data was last fetched
        upProbability:
          type: number
          description: Probability score (0-100) that the stock moves up
        downProbability:
          type: number
          description: Probability score (0-100) that the stock moves down
        finalScore:
          type: number
          description: Weighted final score in roughly [-1, +1]
        trendScore:
          type: number
          description: Trend component score in [-1, +1]
        momentumScore:
          type: number
          description: Momentum component score in [-1, +1]
        rsiScore:
          type: number
          description: RSI component score
        volumeScore:
          type: number
          description: Volume confirmation score (-1, 0, or +1)
        newsScore:
          type: number
          description: Finnhub news sentiment score in [-1, +1]; 0 when unavailable
        socialScore:
          type: number
          description: Finnhub social sentiment score in [-1, +1]; 0 when unavailable
        fundamentalsScore:
          type: number
          description: Finnhub fundamentals quality score in [-0.5, +0.5]; 0 when unavailable
        finnhubContext:
          $ref: "#/components/schemas/FinnhubContext"
        momentum:
          type: number
          description: Raw 5-day price momentum as a decimal fraction
        volume:
          type: number
          description: Most-recent bar volume
        averageVolume:
          type: number
          description: Average daily volume over last 20 bars
        volumeRatio:
          type: number
          description: current volume / average volume
        explanation:
          type: string
          description: Human-readable signal explanation built from component scores
        company:
          type: string
          description: Full company name (empty string if unavailable)
      required:
        - ticker
        - currentPrice
        - prevClose
        - ma20
        - ma50
        - rsi
        - price5dAgo
        - signal
        - confidenceTier
        - explanation
        - change
        - changePercent
        - lastUpdated
        - upProbability
        - downProbability
        - finalScore
        - trendScore
        - momentumScore
        - rsiScore
        - volumeScore
        - newsScore
        - socialScore
        - fundamentalsScore
        - finnhubContext
        - momentum
        - volume
        - averageVolume
        - volumeRatio
        - company

    PriceBar:
      type: object
      properties:
        date:
          type: string
          description: Date in YYYY-MM-DD format
        close:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        volume:
          type: number
        ma20:
          type: ["number", "null"]
        ma50:
          type: ["number", "null"]
      required:
        - date
        - close
        - open
        - high
        - low
        - volume
        - ma20
        - ma50

    StockSignalDetail:
      type: object
      properties:
        ticker:
          type: string
        currentPrice:
          type: number
        prevClose:
          type: number
          description: Previous session closing price
        ma20:
          type: number
        ma50:
          type: number
        rsi:
          type: number
        price5dAgo:
          type: number
          description: Closing price 5 trading days ago
        signal:
          $ref: "#/components/schemas/SignalType"
        confidenceTier:
          $ref: "#/components/schemas/ConfidenceTier"
        change:
          type: number
        changePercent:
          type: number
        lastUpdated:
          type: string
        upProbability:
          type: number
          description: Probability score (0-100) that the stock moves up
        downProbability:
          type: number
          description: Probability score (0-100) that the stock moves down
        finalScore:
          type: number
          description: Weighted final score in roughly [-1, +1]
        trendScore:
          type: number
          description: Trend component score in [-1, +1]
        momentumScore:
          type: number
          description: Momentum component score in [-1, +1]
        rsiScore:
          type: number
          description: RSI component score
        volumeScore:
          type: number
          description: Volume confirmation score (-1, 0, or +1)
        newsScore:
          type: number
          description: Finnhub news sentiment score in [-1, +1]; 0 when unavailable
        socialScore:
          type: number
          description: Finnhub social sentiment score in [-1, +1]; 0 when unavailable
        fundamentalsScore:
          type: number
          description: Finnhub fundamentals quality score in [-0.5, +0.5]; 0 when unavailable
        finnhubContext:
          $ref: "#/components/schemas/FinnhubContext"
        momentum:
          type: number
          description: Raw 5-day price momentum as a decimal fraction
        volume:
          type: number
          description: Most-recent bar volume
        averageVolume:
          type: number
          description: Average daily volume over last 20 bars
        volumeRatio:
          type: number
          description: current volume / average volume
        explanation:
          type: string
          description: Human-readable signal explanation built from component scores
        company:
          type: string
          description: Full company name (empty string if unavailable)
        fundamentalsSnapshot:
          $ref: "#/components/schemas/FundamentalsSnapshot"
        latestNews:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        priceHistory:
          type: array
          items:
            $ref: "#/components/schemas/PriceBar"
      required:
        - ticker
        - currentPrice
        - prevClose
        - ma20
        - ma50
        - rsi
        - price5dAgo
        - signal
        - confidenceTier
        - explanation
        - change
        - changePercent
        - lastUpdated
        - upProbability
        - downProbability
        - finalScore
        - trendScore
        - momentumScore
        - rsiScore
        - volumeScore
        - newsScore
        - socialScore
        - fundamentalsScore
        - finnhubContext
        - momentum
        - volume
        - averageVolume
        - volumeRatio
        - company
        - priceHistory

    PortfolioSummary:
      type: object
      properties:
        totalStocks:
          type: number
        buyCount:
          type: number
        sellCount:
          type: number
        holdCount:
          type: number
        lastUpdated:
          type: string
        tickers:
          type: array
          items:
            type: string
      required:
        - totalStocks
        - buyCount
        - sellCount
        - holdCount
        - lastUpdated
        - tickers
